name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web-react/package-lock.json

      - name: Install React portfolio dependencies
        working-directory: web-react
        run: npm ci

      - name: Check and build React portfolio
        working-directory: web-react
        run: npm run check && npm run build

      - name: Install browser for React portfolio tests
        working-directory: web-react
        run: npx playwright install --with-deps chromium

      - name: Test React portfolio
        working-directory: web-react
        run: npm run test:agents && npm test

      - name: Build public React portfolio
        working-directory: web-react
        env:
          SITE_ORIGIN: https://leo-daher.github.io
          VITE_BASE_PATH: /
          VITE_GA_MEASUREMENT_ID: ${{ vars.GA_MEASUREMENT_ID }}
          VITE_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          VITE_TELEMETRY_ENVIRONMENT: production
          VITE_PORTFOLIO_RELEASE: ${{ github.sha }}
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web-react/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
